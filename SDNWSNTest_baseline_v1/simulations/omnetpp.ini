[General]
network = WSNNetwork
sim-time-limit = 100s
seed-set = 1

*.numSensors = 50

*.node[*].radioRange = 30m
*.node[*].sendInterval = 5s
*.node[*].initialTtl = 15

*.node[*].generationEnergyCost = 0.1
*.node[*].rxEnergyCost = 0.5
*.node[*].txEnergyCost = 1.0
*.node[*].codingEnergyCost = 0.2




